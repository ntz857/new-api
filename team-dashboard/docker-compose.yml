services:
  team-dashboard:
    image: team-dashboard:amd64
    network_mode: host
    environment:
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_DSN=${DB_DSN:-/data/new-api.db}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - SESSION_SECURE=${SESSION_SECURE:-false}
      - PORT=${HOST_PORT:-8080}
      - STATIC_DIR=./frontend/dist
    volumes:
      - ${DB_PATH:-./data}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${HOST_PORT:-8080}/api/team/members"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
